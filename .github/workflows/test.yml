name: Harness checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[mcp]'
      - run: python -m unittest discover -s tests -p test_harness.py -v
      - run: python tests/test_mcp_integration.py
      - run: python evals/run_eval.py --output outputs/evaluation.json

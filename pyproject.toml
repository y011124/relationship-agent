[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relationship-agent"
version = "0.2.0"
description = "Local bilingual relationship reasoning app with an evidence-aware harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]

[project.scripts]
relationship-agent = "relationship_agent.cli:main"
relationship-agent-web = "relationship_agent.server:main"
relationship-agent-mcp = "relationship_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
relationship_agent = ["web/*.html", "web/*.js", "web/*.css"]
